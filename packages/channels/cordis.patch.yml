# DSH Bundle patch — @wsz987/dsh-channels
#
# Inserts the ChannelService, the Harness bridge and the five official
# adapters into a DeepSeek Harness profile.
#
# Every channel below can be disabled through its own plugin config
# (e.g. `plugins.channels-weixin.enabled = false`).
#
# `inject` names follow the Harness public service surface at bundle time;
# adjust when the upstream service names change (converged in channel-harness).

- insert:
    - id: channels-service
      name: '@wsz987/dsh-channels/service'

    # Optional generic-file extension. Remove this line to keep placeholders
    # only; Harness-native image attachments remain available either way.
    - id: channels-files
      name: '@wsz987/dsh-channels/files'

    - id: channels-harness
      name: '@wsz987/dsh-channels/harness'
      inject:
        - channels
        - agents
        - agentDefaultModel
        - llm
        - commands

    - id: channels-control
      name: '@wsz987/dsh-channels/control'
      inject:
        - channels
        - credentials

    - id: channels-weixin
      name: '@wsz987/dsh-channels/weixin'
      inject:
        - channels
        - channelControl

    - id: channels-qq
      name: '@wsz987/dsh-channels/qq'
      inject:
        - channels
        - credentials
        - channelControl

    - id: channels-dingtalk
      name: '@wsz987/dsh-channels/dingtalk'
      inject:
        - channels
        - credentials
        - channelControl

    - id: channels-lark
      name: '@wsz987/dsh-channels/lark'
      inject:
        - channels
        - credentials
        - channelControl

    - id: channels-telegram
      name: '@wsz987/dsh-channels/telegram'
      inject:
        - channels
        - credentials
        - channelControl

    - id: channels-web
      name: '@wsz987/dsh-channels'
