# DSH Bundle patch — @wsz987/dsh-channels
#
# Inserts the ChannelService, the Harness bridge and the four official
# adapters into a DeepSeek Harness profile.
#
# Every channel below can be disabled through its own plugin config
# (e.g. `plugins.channels-weixin.enabled = false`).
#
# `inject` names follow the Harness public service surface at bundle time;
# adjust when the upstream service names change (converged in channel-harness).

- insert:
    - id: channels-service
      name: '@wsz987/channel-core/plugin'

    # Optional generic-file extension. Remove this line to keep placeholders
    # only; Harness-native image attachments remain available either way.
    - id: channels-files
      name: '@wsz987/channel-files'

    - id: channels-harness
      name: '@wsz987/channel-harness'
      inject:
        - channels
        - agents
        - agentDefaultModel
        - llm
        - commands

    - id: channels-control
      name: '@wsz987/channel-control/plugin'
      inject:
        - channels
        - credentials

    - id: channels-weixin
      name: '@wsz987/channel-weixin'
      inject:
        - channels
        - channelControl

    - id: channels-qq
      name: '@wsz987/channel-qq'
      inject:
        - channels
        - credentials
        - channelControl

    - id: channels-dingtalk
      name: '@wsz987/channel-dingtalk'
      inject:
        - channels
        - credentials
        - channelControl

    - id: channels-lark
      name: '@wsz987/channel-lark'
      inject:
        - channels
        - credentials
        - channelControl
    - id: channels-web
      name: '@wsz987/channel-web'
