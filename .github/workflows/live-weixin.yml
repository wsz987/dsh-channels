# Weixin Live Platform Gate.
#
# Split from Offline CI (ci.yml): the live gate exercises the REAL Weixin iLink
# platform, so it must NEVER run on ordinary PRs / pushes. It is
# workflow_dispatch-ONLY — see the R6 live-test separation rule (live tests never
# run on ordinary PRs).
#
# Credential model: Weixin iLink auth is QR-login based (get_bot_qrcode ->
# get_qrcode_status). There are NO pre-seeded app secrets — the live E2E prints a
# QR that a maintainer scans with a real WeChat account. The only repository
# secret is the inert-gate WEIXIN_LIVE_ENABLED.
#
# The workflow is a STRICT preflight: it validates every gate input BEFORE the
# first Weixin request, so a missing/blank value fails fast with an actionable
# message instead of surfacing mid-test as a fuzzy 401/timeout.

name: Weixin Live Gate

on:
  workflow_dispatch:
    inputs:
      upstream_commit:
        description: 'Tencent/openclaw-weixin commit SHA this gate verifies against (40-hex)'
        required: true
      upstream_version:
        description: 'Upstream version/tag this gate verifies against (written to testedVersion)'
        required: true
      base_url:
        description: 'iLink API base URL (blank = production default)'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-gate:
    name: Weixin live E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.3
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

      # Strict preflight: fail fast with actionable messages BEFORE any Weixin
      # request. Every gate input is validated here.
      - name: Preflight — validate live gate inputs
        env:
          WEIXIN_LIVE_ENABLED: ${{ secrets.WEIXIN_LIVE_ENABLED }}
          UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
          UPSTREAM_VERSION: ${{ inputs.upstream_version }}
          BASE_URL: ${{ inputs.base_url }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          if [ "${WEIXIN_LIVE_ENABLED}" != "true" ]; then
            fail "WEIXIN_LIVE_ENABLED is not 'true'. Set the repository secret WEIXIN_LIVE_ENABLED=true before running this gate."
          fi

          if [ -z "${UPSTREAM_COMMIT}" ]; then
            fail "workflow input 'upstream_commit' is required — the Tencent/openclaw-weixin commit SHA being verified."
          fi
          if ! printf '%s' "${UPSTREAM_COMMIT}" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            fail "workflow input 'upstream_commit' must be a 40-hex Git SHA (got: ${UPSTREAM_COMMIT})."
          fi

          if [ -z "${UPSTREAM_VERSION}" ]; then
            fail "workflow input 'upstream_version' is required — the upstream version/tag being verified."
          fi

          TARGET="${BASE_URL:-https://ilinkai.weixin.qq.com}"
          echo "Preflight OK:"
          echo "  - live gate armed (WEIXIN_LIVE_ENABLED=true)"
          echo "  - upstream_commit = ${UPSTREAM_COMMIT}"
          echo "  - upstream_version = ${UPSTREAM_VERSION}"
          echo "  - test target      = ${TARGET}"
          echo "NOTE: the live E2E performs QR login — scan the printed QR with a real WeChat account when prompted."

      - name: Weixin live E2E
        env:
          DSH_WEIXIN_LIVE: '1'
          DSH_WEIXIN_BASE_URL: ${{ inputs.base_url }}
          DSH_WEIXIN_UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
          DSH_WEIXIN_UPSTREAM_VERSION: ${{ inputs.upstream_version }}
        run: pnpm --filter @wsz987/channel-weixin test:live
