# Phase 16 release automation (docs/release.md).
#
# Tag-driven publish: this workflow runs ONLY when a `v*` release tag is pushed
# (or manually via workflow_dispatch). Normal commits and pull requests do NOT
# trigger it.
#
# Release flow (manual, before tagging):
#   1. `pnpm changeset version`  — bump versions + write changelogs locally.
#   2. commit the version bump.
#   3. `git tag vX.Y.Z && git push origin vX.Y.Z`
# The tag push runs this workflow, which publishes every package whose current
# version is not yet on npm (`pnpm release` = `changeset publish`).
#
# The publish stays INERT until the `NPM_TOKEN` repository secret is configured
# (an npm automation token with publish rights for the @dsh scope). Without it the
# publish step fails — configure the secret to activate releases.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.3
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # lib/ is gitignored — build before publishing so the tarball ships the
      # prebuilt JS + types described in docs/release.md.
      - name: Build packages
        run: pnpm build
      - name: Configure npm registry auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish packages
        run: pnpm release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
