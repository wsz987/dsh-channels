name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    name: Verify and pack npm artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.3
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release metadata and tag
        run: pnpm release:verify
      - name: Test release scripts
        run: pnpm test:release
      - name: Build packages
        run: pnpm build
      - name: Typecheck packages
        run: pnpm typecheck
      - name: Test packages
        run: pnpm test
      - name: Run governance gates
        run: pnpm check:fixtures && pnpm check:manifests && pnpm doctor && pnpm check:bundle
      - name: Pack and inspect npm artifacts
        run: pnpm release:pack
      - name: Upload exact npm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ github.sha }}
          path: dist/npm/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish npm packages
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: pack
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.3
      - name: Setup Node and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.5.1
      - name: Check publish runtime
        run: node --version && npm --version
      - name: Download verified npm artifacts
        uses: actions/download-artifact@v4
        with:
          name: npm-${{ github.sha }}
          path: dist/npm
      - name: Publish exact artifacts
        run: pnpm release:publish
