# Example DSH profile — minimal — @dsh/channels bundle result.
#
# This file shows what the @dsh/channels bundle (cordis.patch.yml) inserts into
# a clean DeepSeek Harness profile: the ChannelService, the Harness bridge and
# the four official channel adapters, keyed by the plugin ids from the patch.
#
# Apply it to a clean profile with the dsh CLI (see README.md here and
# docs/release.md "DSH Bundle Validation"):
#
#   dsh plugin --profile minimal add ./packages/channels
#   dsh --profile minimal --dump-config
#   dsh --profile minimal
#
# Every channel below can be disabled independently via its own `enabled` key
# (each adapter plugin's apply() returns early when enabled is false) —
# commented `enabled: false` examples are included for all four channels.

plugins:
  # ChannelService — stable cross-channel contract, registered at ctx.channels.
  channels-service:
    enabled: true

  # Harness bridge — wires the ChannelService to the Harness `agents` service.
  # The plugin declares inject: [channels, agents], so it only starts once the
  # ChannelService AND the Harness AgentRegistry are both available.
  channels-harness:
    # Agent used when routing resolves nothing more specific.
    defaultAgentId: default
    routing:
      mode: global
      # Per-level agent overrides (conversation > account > channel > default).
      # overrides:
      #   channel:
      #     weixin: weixin-agent
      #   account:
      #     qq: qq-agent
      #   conversation:
      #     "lark:main:oc_abc123": lark-agent
    bindingStore:
      # File-backed by default: session bindings persist across restarts
      # (path is relative to the process cwd; created on demand).
      type: file
      path: ./data/channels/bindings.json
      # Use an in-memory store when restart recovery is not needed:
      # type: memory
    reply:
      updateIntervalMs: 200
      maxTextLength: 4000
      splitParagraphs: true
      splitCodeBlocks: true
      finalFlush: true
    maxConcurrency: 4
    includeMetadataPrefix: true
    # agentOptions:
    #   provider: deepseek
    #   model: deepseek-chat

  # Weixin (buffered streaming, QR auth via the self-hosted upstream gateway).
  channels-weixin:
    enabled: true
    accountId: main
    baseUrl: http://127.0.0.1:9000
    timeoutMs: 30000
    longPollTimeoutMs: 25000
    # Disable this channel without removing the plugin:
    # enabled: false

  # QQ (buffered streaming, dm/group, QR auth).
  channels-qq:
    enabled: true
    accountId: main
    baseUrl: http://127.0.0.1:9001
    timeoutMs: 30000
    longPollTimeoutMs: 25000
    # enabled: false

  # DingTalk (AI Card streaming — edit strategy).
  channels-dingtalk:
    enabled: true
    accountId: main
    baseUrl: http://127.0.0.1:9002
    timeoutMs: 30000
    longPollTimeoutMs: 25000
    # enabled: false

  # Lark / Feishu (threads preserved per conversation, editable card streaming).
  channels-lark:
    enabled: true
    accountId: main
    baseUrl: http://127.0.0.1:9003
    timeoutMs: 30000
    longPollTimeoutMs: 25000
    # enabled: false
